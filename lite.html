<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Никита Горбачев — продуктовый дизайнер</title>
<meta name="description" content="Портфолио продуктового дизайнера Никиты Горбачева: кейсы, пэт-проекты и контакты.">
<meta name="theme-color" content="#f3f2ee">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<!-- v111: кадр холма в двух размерах — 1672 и 3344 px (апскейл Real-ESRGAN x4plus из оригинала Никиты), ретина берёт второй -->
<link rel="preload" as="image" imagesrcset="lite/hero/hill.avif 1672w, lite/hero/hill@2x.avif 3344w" imagesizes="(min-width: 1440px) 1360px, 100vw" type="image/avif" fetchpriority="high">
</head>
<body>
<a class="ll-skip" href="#work" data-ll="skip"></a>

<!-- шапка как в 3D-версии (ui/hero/notch.css): чёлка со знаком и разделами; язык и переход в 3D — отдельно слева -->
<header class="ll-top">
  <nav class="ll-notch" aria-label="Разделы" data-ll-label="nav.label" data-section="home">
    <a class="ll-notch__item ll-notch__mark" href="#top" data-ll-label="nav.home">
      <svg viewBox="-35 -25 150 150" aria-hidden="true"><path d="M0 100H20V74.538C30.615 90.372 44.633 100 60 100H80V0H60V82.704C40.662 82.704 24.437 55.963 20 19.897V0H0Z"/></svg>
    </a>
    <a class="ll-notch__item" href="#about" data-nav="about"><svg class="ll-glyph" viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="5.4" r="2.7"/><path d="M2.8 13.8c.7-2.7 2.5-4.1 5.2-4.1s4.5 1.4 5.2 4.1"/></svg><span data-ll="nav.about"></span></a>
    <a class="ll-notch__item" href="#work" data-nav="work"><svg class="ll-glyph" viewBox="0 0 16 16" aria-hidden="true"><rect x="2.2" y="2.6" width="11.6" height="8.4" rx="1.4"/><path d="M5.6 13.6h4.8"/></svg><span data-ll="nav.work"></span></a>
    <a class="ll-notch__item" href="#lab" data-nav="lab"><svg class="ll-glyph" viewBox="0 0 16 16" aria-hidden="true"><path d="M6.2 2.3h3.6M6.9 2.3v3.9l-3.5 5.9a1.3 1.3 0 0 0 1.1 2h7a1.3 1.3 0 0 0 1.1-2L9.1 6.2V2.3"/><path d="M5 10.4h6"/></svg><span data-ll="nav.lab"></span></a>
    <a class="ll-notch__item ll-notch__hi" href="#contact" data-nav="contact"><svg class="ll-glyph" viewBox="0 0 16 16" aria-hidden="true"><path d="M2.4 4.2h11.2v7.6H2.4z"/><path d="m2.6 4.5 5.4 4.2 5.4-4.2"/></svg><span data-ll="nav.hi"></span></a>
  </nav>
  <div class="ll-tools">
    <div class="ll-lang" role="group" data-ll-label="nav.langs">
      <button type="button" data-lang-set="ru" lang="ru">RU</button>
      <button type="button" data-lang-set="en" lang="en">EN</button>
    </div>
    <a class="ll-3d" href="./?lite=0" data-ll-label="nav.3d.label"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m12 3 8 4.5v9L12 21l-8-4.5v-9z"/><path d="m4 7.5 8 4.5 8-4.5M12 12v9"/></svg><span data-ll="nav.3d"></span></a>
  </div>
</header>

<main id="top">
  <!-- первый экран: имя крупным словом, справа короткая подпись, ниже — кадр холма в рамке -->
  <section class="hero" aria-labelledby="ll-name">
    <div class="hero__head">
      <h1 class="hero__name" id="ll-name" data-ll="hero.name"></h1>
      <div class="hero__aside">
        <div class="hero__who">
          <img src="ui/portrait.jpg" alt="" width="44" height="44">
          <span class="hero__tag" data-ll="hero.role"></span>
        </div>
        <p data-ll="hero.lead"></p>
      </div>
    </div>

    <figure class="hero__frame">
      <picture>
        <source srcset="lite/hero/hill.avif 1672w, lite/hero/hill@2x.avif 3344w" sizes="(min-width: 1440px) 1360px, 100vw" type="image/avif">
        <img src="lite/hero/hill.webp" srcset="lite/hero/hill.webp 1672w, lite/hero/hill@2x.webp 3344w" sizes="(min-width: 1440px) 1360px, 100vw" alt="" data-ll-alt="hero.alt" width="1672" height="941" fetchpriority="high">
      </picture>
      <!-- колода, как в карточке 3D-версии: кейсы, потом пэт-проекты (heroDeck.ts) -->
      <div class="hero__deck" role="group" tabindex="0" data-ll-label="deck.label">
        <div class="hero__deck-bar">
          <span class="hero__deck-kind" data-deck-kind></span>
          <span class="hero__deck-nav">
            <button type="button" data-deck-step="-1"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m14 6-6 6 6 6"/></svg></button>
            <span class="hero__deck-count" data-deck-count></span>
            <button type="button" data-deck-step="1"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m10 6 6 6-6 6"/></svg></button>
          </span>
        </div>
        <a class="hero__case" data-deck-link href="./?lite=1#/work/grif-ai">
          <img data-deck-img src="ui/card-grif-ai.webp" alt="" width="120" height="76">
          <span class="hero__case-body">
            <span class="hero__case-title" data-deck-title>GRIF AI</span>
            <span class="hero__case-meta" data-deck-meta></span>
          </span>
          <span class="ll-round" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M8 16 16 8M9 8h7v7"/></svg></span>
        </a>
      </div>
    </figure>
  </section>

  <!-- v114: лента итогов — идея с портфолио klinaeva (шоурил результатов раскрывается из первого экрана, остальная
       страница листом наезжает сверху); вёрстка и код свои. Кейс за кейсом: крупная цифра и экран продукта (reel.ts) -->
  <section class="ll-reel" id="results" aria-labelledby="ll-reel-title" data-reel>
    <div class="ll-reel__stage">
      <div class="ll-reel__bar">
        <p class="ll-label ll-label--light" id="ll-reel-title" data-ll="reel.title"></p>
        <p class="ll-reel__count" data-reel-count></p>
      </div>
      <div class="ll-reel__slides" data-reel-slides></div>
      <ol class="ll-reel__track" aria-hidden="true" data-reel-track></ol>
    </div>
  </section>

  <!-- остальная страница — лист со скруглённым верхом: наезжает на последний кадр ленты -->
  <div class="ll-sheet">
  <!-- о себе: одна фраза крупно, продолжение светлее — как абзац на референсе -->
  <section class="ll-statement" id="about" aria-labelledby="ll-about">
    <p class="ll-label" id="ll-about" data-ll="nav.about"></p>
    <p class="ll-statement__text"><span data-statement="lead"></span> <span class="ll-statement__rest" data-statement="rest"></span></p>
  </section>

  <!-- где работал: карточки по CV — знак, месяцы, должность, главный результат; наведённая и соседи приподнимаются -->
  <section class="ll-exp" id="experience" aria-labelledby="ll-exp-title">
    <p class="ll-label" id="ll-exp-title" data-ll="exp.title"></p>
    <ul class="ll-exp__grid" data-exp></ul>
  </section>

  <section class="ll-facts" data-ll-label="facts.label">
    <article class="ll-fact ll-fact--dark">
      <p class="ll-fact__label" data-ll="about.fact.years.sub"></p>
      <p class="ll-fact__text" data-ll="about.p2"></p>
      <p class="ll-fact__num" data-ll="about.fact.years"></p>
    </article>
  </section>

  <section class="ll-sec" id="work" aria-labelledby="ll-work">
    <header class="ll-head">
      <div>
        <h2 id="ll-work" class="ll-rise"><span data-ll="work.title"></span></h2>
        <p data-ll="work.note"></p>
      </div>
      <div class="ll-chips" role="group" data-ll-label="work.filter">
        <button type="button" class="ll-chip" data-kind="all" aria-pressed="true" data-ll="filter.all"></button>
        <button type="button" class="ll-chip" data-kind="web" aria-pressed="false" data-ll="filter.web"></button>
        <button type="button" class="ll-chip" data-kind="mobile" aria-pressed="false" data-ll="filter.mobile"></button>
      </div>
    </header>
    <ul class="ll-grid" data-cases></ul>
  </section>

  <section class="ll-sec" id="lab" aria-labelledby="ll-lab">
    <header class="ll-head">
      <div>
        <h2 id="ll-lab" class="ll-rise"><span data-ll="notes.pick"></span></h2>
        <p data-ll="lab.note"></p>
      </div>
    </header>
    <ul class="ll-list" data-notes></ul>
  </section>
  </div>
</main>

<footer class="ll-foot" id="contact" aria-labelledby="ll-contact">
  <div class="ll-foot__top">
    <div>
      <p class="ll-label ll-label--light" data-ll="footer.kicker"></p>
      <h2 id="ll-contact" class="ll-rise"><span data-ll="contact.title"></span></h2>
      <p class="ll-foot__mailrow">
        <a class="ll-foot__mail" href="mailto:kloserock97@gmail.com">kloserock97@gmail.com</a>
        <button type="button" class="ll-copy" data-copy="kloserock97@gmail.com"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="8.5" y="8.5" width="11" height="11" rx="2"/><path d="M15.5 8.5V6A1.5 1.5 0 0 0 14 4.5H6A1.5 1.5 0 0 0 4.5 6v8A1.5 1.5 0 0 0 6 15.5h2.5"/></svg><span data-ll="mail.copy" data-copy-label></span></button>
      </p>
    </div>
    <nav class="ll-foot__cols" aria-label="Ссылки">
      <div>
        <p data-ll="foot.nav"></p>
        <a href="#about" data-ll="nav.about"></a>
        <a href="#work" data-ll="nav.work"></a>
        <a href="#lab" data-ll="nav.lab"></a>
        <a href="./?lite=0" data-ll="footer.nav.3d"></a>
      </div>
      <div>
        <p data-ll="foot.social"></p>
        <a href="https://t.me/Gorbachev_Nikita_Designer" target="_blank" rel="noopener">Telegram</a>
        <a href="https://www.linkedin.com/in/nikita-gorbachev-productdesigner" target="_blank" rel="noopener">LinkedIn</a>
        <a href="https://github.com/kloserock97-tech" target="_blank" rel="noopener">GitHub</a>
      </div>
    </nav>
  </div>
  <!-- слово символами ASCII (asciiWord.ts); для экранных дикторов — обычным текстом -->
  <pre class="ll-foot__ascii" aria-hidden="true"></pre>
  <p class="ll-visually-hidden" data-ll="foot.word"></p>
  <p class="ll-foot__copy" data-ll="footer.copyright"></p>
</footer>

<script type="module" src="/src/liteLab/main.ts"></script>
</body>
</html>
