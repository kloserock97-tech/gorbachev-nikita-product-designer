<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Case cards</title>
<!-- Шаблон обложек кейсов для лёгкой версии (tools/render-case-cards.mjs снимает его в public/lite/cards/<id>.webp).
     Обложка — настоящий экран продукта на цветах кейса: веб — один экран в скруглённой рамке, уходящий за край;
     мобильные концепты — два экрана телефона рядом. Вместо вырезанных диорам, которые смотрелись дёшево. -->
<style>
  html, body { margin: 0; }
  body { width: 960px; height: 600px; overflow: hidden; font-family: Onest, "Segoe UI", sans-serif; }
  .card { position: relative; width: 960px; height: 600px; overflow: hidden; background: linear-gradient(150deg, var(--a), var(--b)); }
  /* мягкий свет сверху слева и лёгкая сетка точек — фон не плоский, но и не спорит с экраном */
  .card::before { content: ""; position: absolute; inset: 0; background: radial-gradient(70% 80% at 12% 0%, rgba(255,255,255,.55), transparent 60%); }
  .card::after { content: ""; position: absolute; inset: 0; background-image: radial-gradient(rgba(0,0,0,.07) 1px, transparent 1.2px); background-size: 18px 18px; mask-image: linear-gradient(160deg, #000, transparent 60%); }
  .web { position: absolute; z-index: 1; left: 84px; top: 74px; width: 1000px; border-radius: 18px; overflow: hidden; background: #fff;
    box-shadow: 0 0 0 1px rgba(255,255,255,.7), 0 2px 4px rgba(20,20,30,.08), 0 40px 80px -20px rgba(20,24,40,.35); }
  .web img { display: block; width: 100%; height: auto; }
  .phones { position: absolute; z-index: 1; inset: 0; display: flex; justify-content: center; align-items: flex-start; gap: 34px; padding-top: 70px; }
  .phone { width: 248px; aspect-ratio: 9 / 19.5; border-radius: 40px; overflow: hidden; background: #0d0d0f; border: 7px solid #121214;
    box-shadow: 0 0 0 1px rgba(255,255,255,.18), 0 40px 70px -18px rgba(20,24,40,.45); }
  .phone + .phone { margin-top: 70px; }
  .phone img { display: block; width: 100%; height: 100%; object-fit: cover; object-position: top; }
</style>
</head>
<body>
<div class="card" id="card"></div>
<script>
  const CARDS = {
    "grif-ai": { a: "#eef3fb", b: "#c7d8f3", web: "cases/grif-ai/05.webp" },
    community: { a: "#fcefe6", b: "#f2cfb8", web: "cases/community/01@2x.webp" },
    "ai-agents": { a: "#edf6f0", b: "#c6e2cf", web: "cases/ai-agents/01@2x.webp" },
    "moderator-dashboard": { a: "#f1eef9", b: "#d3c9ec", web: "cases/figma/moderator-queue.webp" },
    "plati-chastyami": { a: "#effaf3", b: "#c3e6d3", phones: ["cases/plati-chastyami/01-sbol-widget.webp", "cases/plati-chastyami/03-move-confirm.webp"] },
    "restaurant-guru": { a: "#fbf0ef", b: "#ecd0ce", phones: ["cases/restaurant-guru/01-home.webp", "cases/restaurant-guru/03-guide-invite.webp"] },
  };
  const id = new URLSearchParams(location.search).get("id");
  const c = CARDS[id];
  const card = document.getElementById("card");
  card.style.setProperty("--a", c.a);
  card.style.setProperty("--b", c.b);
  card.innerHTML = c.web
    ? `<div class="web"><img src="/${c.web}" alt=""></div>`
    : `<div class="phones">${c.phones.map((p) => `<div class="phone"><img src="/${p}" alt=""></div>`).join("")}</div>`;
  Promise.all([...document.images].map((i) => i.decode().catch(() => {}))).then(() => (window.cardReady = true));
</script>
</body>
</html>
