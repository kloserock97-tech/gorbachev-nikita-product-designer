<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<style>
@font-face{font-family:Lexend;src:url(fonts/lexend-latin.woff2) format('woff2');font-weight:100 900;font-display:block}
*{margin:0;padding:0;box-sizing:border-box}
body{width:1200px;height:630px;overflow:hidden;font-family:Lexend,system-ui,sans-serif;position:relative;background:#1e2219}
.bg{position:absolute;inset:0;background:url(ui/hill-poster.webp) center/cover no-repeat}
.veil{position:absolute;inset:0;background:
  linear-gradient(100deg,rgba(16,20,13,.95) 0%,rgba(18,23,15,.9) 46%,rgba(22,28,18,.5) 72%,rgba(24,30,20,.14) 100%),
  radial-gradient(120% 90% at 8% 100%,rgba(10,14,8,.6),transparent 60%)}
.wrap{position:absolute;inset:0;padding:70px 76px;display:flex;flex-direction:column;justify-content:space-between;color:#f4f1ea}
.kicker{font-size:19px;font-weight:500;letter-spacing:.26em;text-transform:uppercase;color:#9fe38b;opacity:.95}
h1{font-size:82px;font-weight:300;line-height:1.02;letter-spacing:-.035em;max-width:11em;text-shadow:0 2px 26px rgba(0,0,0,.5)}
h1 b{font-weight:400}
.role{margin-top:22px;font-size:31px;font-weight:300;line-height:1.3;letter-spacing:-.012em;color:#e4e2d6;max-width:13.6em;text-shadow:0 1px 18px rgba(0,0,0,.45)}
.foot{display:flex;align-items:center;gap:14px}
.chip{font-size:20px;font-weight:400;letter-spacing:.01em;padding:11px 22px;border-radius:999px;
  background:rgba(244,241,234,.09);box-shadow:inset 0 0 0 1px rgba(255,255,255,.18);color:#f0eee4}
.url{margin-left:auto;font-size:20px;font-weight:300;letter-spacing:.02em;color:#c9cdbd}
.mark{position:absolute;right:76px;top:66px;width:76px;height:76px;border-radius:50%;
  background:rgba(16,20,13,.5);box-shadow:inset 0 0 0 1px rgba(255,255,255,.22);display:grid;place-items:center}
.mark svg{width:48px;height:48px;fill:none;stroke:#9fe38b;stroke-width:1.3;stroke-linecap:round;stroke-linejoin:round}
</style></head><body>
<div class="bg"></div><div class="veil"></div>
<div class="mark"><svg viewBox="0 0 24 24">
<path fill-rule="evenodd" style="fill:#9fe38b;stroke:none" d="M1.6 13.4C1.8 9.6 5.6 7.4 9.8 7.6c1.5.1 2.8.5 4 1.1l.8-1.1.7 1.9c1.2.7 2.2 1.2 3.1 1.2.3-1.7-.2-3.4-1.6-5 1.6.1 2.9.8 3.7 2 .5-1.3 1.4-2.2 2.8-2.6 0 2.3-1 4-2.6 5.1-.3 2.2-1.6 4.1-3.6 5.5-1.4 1-3.1 1.6-4.9 1.9l2.6 4.3c-2.6-.2-4.7-1.5-6-3.9-4-.3-7.2-1.6-7.2-4.6Zm3.9-.5a.8.8 0 1 0 0-1.6.8.8 0 0 0 0 1.6Zm-3.1 1.3c1.9.9 4 1.2 6.3.8l.13.68c-2.45.43-4.7.1-6.73-.86Z"/>
<path d="M5.7 5.5c0-1.2-.6-2-1.7-2.3M7 5.500c0-1.200.600-2 1.700-2.300" style="fill:none;stroke:#9fe38b;stroke-width:1.15;stroke-linecap:round"/></svg></div>
<div class="wrap">
  <p class="kicker">Product designer</p>
  <div>
    <h1>Nikita <b>Gorbachev</b></h1>
    <p class="role">Complex products and AI-enabled services, from discovery to final UI, metrics and scale.</p>
  </div>
  <div class="foot">
    <span class="chip">Sber</span><span class="chip">Mos.ru</span><span class="chip">Ozon</span><span class="chip">GRIF AI</span>
    <span class="url">6 case studies · 2024–2026</span>
  </div>
</div>
</body></html>
